<ion-content>
  <div class="food-delivery-container">
    <h1>МЕНЮ ДОСТАВКИ ЇЖІ</h1>
    
    <div *ngIf="isLoading" class="loading-spinner">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <ion-grid>
      <ion-row>
        <ion-col size="12" size-md="4" *ngFor="let product of products">
          <ion-card>
            <img [src]="product.getImage()" alt="{{ product.getName() }}" class="product-image">
            <ion-card-header>
              <ion-card-title>{{ product.getName() }}</ion-card-title>
              <ion-card-subtitle>{{ product.getCategory() }}</ion-card-subtitle>
            </ion-card-header>
            
            <ion-card-content>
              <ion-list lines="none">
                <ion-item *ngFor="let detail of product.getDetails()">
                  <ion-label>{{ detail }}</ion-label>
                </ion-item>
                <ion-item>
                  <ion-label>Ціна: {{ product.getPrice() }} грн</ion-label>
                </ion-item>
              </ion-list>
              
              <ion-button 
                expand="block" 
                color="primary">
                ДОДАТИ ДО КОШИКА
              </ion-button>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
